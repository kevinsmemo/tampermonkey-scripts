<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>YouTube Slides Extractor 設定</title><style>body{font:15px system-ui;max-width:740px;margin:40px auto;padding:0 20px;color:#20252d}button,input{font:inherit;padding:10px;margin:6px 0}#folder{width:95%}.card{border:1px solid #ccc;padding:18px;border-radius:12px;margin:18px 0}button{cursor:pointer}p{line-height:1.65}#status,#result{white-space:pre-wrap}</style><h1>YouTube Slides Extractor</h1><div class="card"><p id="status">讀取中…</p><button id="sync">立即同步</button> <button id="refresh">重新整理狀態</button><p id="result" role="status"></p></div><div class="card"><h2>首次連接 Google Drive</h2><p>既有資料夾模式：Google 會要求完整 Drive 權限；程式只操作下方指定的 YouTube Slides 資料夾，不提供雲端刪除功能。</p><label for="folder">既有 YouTube Slides 資料夾網址或 ID</label><input id="folder" placeholder="https://drive.google.com/drive/folders/…"><p><label><input type="checkbox" id="confirm"> 我了解完整 Drive 權限，並確認資料夾。</label></p><button id="existing">連接既有資料夾／重新授權</button><hr><p>最小權限模式：建立／使用本套件專用的 YouTube Slides - API 資料夾（drive.file），不會自動匯入舊檔。</p><button id="new">連接 API 專用資料夾／重新授權</button><p>同一安裝只綁定一個帳號與資料夾。離線原圖保留本機；卸載套件前請先匯出或完成同步。</p></div><script src="options.js"></script></html>
